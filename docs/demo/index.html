<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP se define desde Electron (main.cjs) para diferenciar dev/prod -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
      if (typeof global === "undefined") {
        window.global = window;
      }
      try {
        if (localStorage.getItem("onicord_theme_mode") === "light") {
          var root = document.documentElement;
          root.classList.add("light-mode");
          root.setAttribute("data-theme", "light");
          root.style.colorScheme = "light";
        }
      } catch (_) {}
    </script>
    <title>Onicord</title>
    <script type="module" crossorigin src="./assets/index-CJHHYsUS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DY483kyK.css">
  </head>
  <body class="bg-onicord-base text-onicord-text antialiased">
    <div id="root"></div>
  </body>
</html>
