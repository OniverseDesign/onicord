<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..400,0,0" />
  <style>
    :root {
      --text: #f8fafc;
      --subtext: rgba(255, 255, 255, 0.72);
      --muted: rgba(255, 255, 255, 0.45);
      --border-die: rgba(255, 255, 255, 0.55);
      --border-pill: rgba(255, 255, 255, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.18);
      --squircle-radius: 18px;
      --red: #f38ba8;
      --gold: #f9e2af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: 300;
      font-style: normal;
      font-size: 17px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      color: var(--text);
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 14px;
      position: relative;
    }

    /* Top Right Action Buttons (Volume, Add, Settings) */
    .top-actions {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: var(--subtext);
      opacity: 0.65;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s ease, opacity 0.15s ease;
      outline: none;
    }

    .btn-action:hover {
      opacity: 1;
      color: var(--text);
    }

    .btn-action:active {
      opacity: 0.9;
    }

    .btn-action.active {
      opacity: 1;
      color: var(--border-die);
    }

    /* Main Area */
    .main-canvas {
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Empty Dropzone State */
    .empty-dropzone {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px dashed var(--border-subtle);
      border-radius: var(--squircle-radius);
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.18s ease, background 0.18s ease;
      gap: 8px;
      text-align: center;
      padding: 16px;
    }

    .empty-dropzone:hover, .empty-dropzone.dragover, body.dragover .empty-dropzone {
      border-color: var(--border-die);
      background: rgba(255, 255, 255, 0.05);
    }

    .empty-icon {
      font-size: 36px !important;
      color: var(--subtext);
      opacity: 0.7;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .empty-sub {
      font-size: 11.5px;
      color: var(--muted);
      max-width: 210px;
      line-height: 1.35;
    }

    /* Sound Grid */
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 10px;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 38px;
      padding-bottom: 12px;
      padding-right: 4px;
      align-content: start;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      overscroll-behavior: contain;
    }

    /* Squircle Sound Button */
    .sound-card {
      background: rgba(255, 255, 255, 0.035);
      border: 2px solid var(--border-die);
      border-radius: var(--squircle-radius);
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      min-height: 82px;
      height: 82px;
      position: relative;
      overflow: hidden;
    }

    .sound-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: #ffffff;
    }

    .sound-card.playing {
      border-color: #ffffff !important;
      background: rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35) !important;
    }

    .card-icon {
      font-size: 20px !important;
      line-height: 1;
      height: 20px;
      color: var(--subtext);
      transition: color 0.15s ease;
    }

    .sound-card.playing .card-icon {
      color: #ffffff;
      animation: iconShake 0.12s infinite alternate ease-in-out;
    }

    @keyframes iconShake {
      from { transform: scale(0.95) rotate(-2deg); }
      to { transform: scale(1.18) rotate(2deg); }
    }

    .card-name-wrapper {
      width: 100%;
      max-width: 86px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 18px;
      line-height: 18px;
      position: relative;
    }

    .sound-card.has-overflow .card-name-wrapper {
      justify-content: flex-start;
    }

    .card-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.2px;
      line-height: 16px;
      height: 16px;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 1px;
      margin: 0;
      will-change: transform;
      transition: color 0.15s ease;
    }

    .sound-card.has-overflow:hover .card-name,
    .sound-card.has-overflow.playing .card-name {
      max-width: none;
      overflow: visible;
      text-overflow: clip;
      animation: marqueeText var(--marquee-dur, 3.8s) cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes marqueeText {
      0%, 20% {
        transform: translateX(0);
      }
      80%, 100% {
        transform: translateX(var(--marquee-dist, -40px));
      }
    }

    .card-duration {
      font-size: 9.5px;
      line-height: 12px;
      height: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ─── SIMPLIFIED SETTINGS OVERLAY ─── */
    .panel-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      padding: 14px 16px 14px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      z-index: 30;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .panel-overlay.show {
      display: flex;
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .setting-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex-shrink: 0;
    }

    .setting-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--subtext);
    }

    /* Volume Pill Stepper */
    .vol-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--border-pill);
      border-radius: 9999px;
      padding: 3px 12px;
      background: rgba(255, 255, 255, 0.03);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      outline: none;
      transition: opacity 0.15s;
    }

    .pill-btn:hover {
      opacity: 0.7;
    }

    .vol-slider {
      width: 65px;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
    }

    .vol-num {
      font-size: 12px;
      font-weight: 700;
      min-width: 30px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Sound Management List in Settings */
    .manage-list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .manage-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      min-height: 0;
      max-height: 110px;
      padding-right: 4px;
      width: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      overscroll-behavior: contain;
    }

    .manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.025);
      transition: background 0.12s ease, border-color 0.12s ease;
      flex-shrink: 0;
    }

    .manage-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-pill);
    }

    .manage-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .manage-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      max-width: 115px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 16px;
      height: 16px;
      cursor: pointer;
    }

    .manage-name:hover {
      color: #ffffff;
    }

    .btn-edit-item {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s ease, opacity 0.15s ease;
      outline: none;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .btn-edit-item:hover {
      color: var(--text);
      opacity: 1;
    }

    .manage-edit-row {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
    }

    .manage-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-die);
      border-radius: 6px;
      color: var(--text);
      padding: 2px 8px;
      font-size: 11.5px;
      flex: 1;
      min-width: 0;
      height: 22px;
      outline: none;
      font-family: inherit;
    }

    .manage-input:focus {
      border-color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
    }

    .btn-save-rename {
      background: transparent;
      border: none;
      color: #a6e3a1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s ease;
      outline: none;
      flex-shrink: 0;
    }

    .btn-save-rename:hover {
      color: #ffffff;
    }

    .btn-cancel-rename {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s ease;
      outline: none;
      flex-shrink: 0;
    }

    .btn-cancel-rename:hover {
      color: var(--red);
    }

    .manage-dur {
      font-size: 9.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .btn-del-item {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 4px;
      transition: color 0.15s ease;
      outline: none;
    }

    .btn-del-item:hover {
      color: var(--red);
    }

    .empty-manage {
      font-size: 11.5px;
      color: var(--muted);
      text-align: center;
      padding: 20px 0;
    }

    .save-pill-btn {
      align-self: center;
      border: 1.5px solid var(--border-die);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 6px 32px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      outline: none;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .save-pill-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .clear-pill-btn {
      align-self: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      outline: none;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .clear-pill-btn:hover {
      background: rgba(243, 139, 168, 0.12);
      border-color: rgba(243, 139, 168, 0.4);
      color: var(--red);
    }

    /* Drag Overlay when sounds exist */
    body.dragover::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px dashed var(--border-die);
      border-radius: var(--squircle-radius);
      background: rgba(255, 255, 255, 0.05);
      pointer-events: none;
      z-index: 20;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Top Right Action Buttons: Add Audio, Settings -->
  <div class="top-actions">
    <button class="btn-action" id="btnAdd" title="Añadir audio (.mp3, .wav, .ogg)">
      <span class="material-symbols-outlined">add</span>
    </button>
    <button class="btn-action" id="btnSettings" title="Configuración">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </div>

  <!-- Main Canvas -->
  <div class="main-canvas" id="canvas">
    <!-- Empty State Dropzone -->
    <div class="empty-dropzone" id="emptyDropzone">
      <span class="material-symbols-outlined empty-icon">graphic_eq</span>
      <div class="empty-title" id="txtEmptyTitle">Arrastra audios aquí</div>
      <div class="empty-sub" id="txtEmptySub">o haz clic para subir (.mp3, .wav, .ogg)</div>
    </div>

    <!-- Sound Cards Grid -->
    <div class="sound-grid" id="soundGrid" style="display: none;"></div>
  </div>

  <!-- Settings Simplified Overlay -->
  <div class="panel-overlay" id="panelSettings">
    <div class="panel-header">
      <span class="panel-title" id="txtSettingsTitle">Configuración</span>
      <button class="btn-action" id="btnCloseSettings" title="Cerrar">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="setting-section">
      <!-- Volume Row -->
      <div class="setting-row">
        <span class="setting-label" id="txtVolLabel">Volumen</span>
        <div class="vol-pill">
          <button class="pill-btn" id="btnMute" title="Silenciar / Activar">
            <span class="material-symbols-outlined" id="soundIcon" style="font-size: 16px;">volume_up</span>
          </button>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="0.8">
          <span class="vol-num" id="valVol">80%</span>
        </div>
      </div>

      <!-- Manage & Delete Sounds Section -->
      <div class="manage-list-container">
        <div class="setting-row">
          <span class="setting-label" id="txtInstalledLabel">Sonidos instalados</span>
          <span class="setting-label" id="soundCountLabel" style="color: var(--muted); font-size: 11px;">0 sonidos</span>
        </div>

        <div class="manage-list" id="manageList">
          <div class="empty-manage" id="txtEmptyManage">No hay sonidos agregados aún.</div>
        </div>
      </div>

      <!-- Clear All Pill Button -->
      <button class="clear-pill-btn" id="btnClearAll" style="display: none;">
        <span class="material-symbols-outlined" style="font-size: 14px;">delete_sweep</span>
        <span id="txtClearAll">Vaciar soundboard</span>
      </button>
    </div>

    <!-- Done Pill Button -->
    <button class="save-pill-btn" id="btnDoneSettings">Listo</button>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.opus,.m4a,.aac,.flac,.webm" multiple style="display: none;">

  <script>
    // ─── I18N SUPPORT ────────────────────────────────────────────────
    const I18N = {
      es: {
        addAudio: "Añadir audio (.mp3, .wav, .ogg)",
        settings: "Configuración",
        dragAudios: "Arrastra audios aquí",
        clickUpload: "o haz clic para subir (.mp3, .wav, .ogg)",
        volume: "Volumen",
        installedSounds: "Sonidos instalados",
        noSoundsYet: "No hay sonidos agregados aún.",
        clearSoundboard: "Vaciar soundboard",
        done: "Listo",
        soundSingular: "sonido",
        soundPlural: "sonidos",
        playInVoice: "Reproducir en canal de voz",
        previewOnly: "Escucha previa (solo tú - no estás en un chat de voz)",
        renameTooltip: "Doble clic o clic en lápiz para renombrar",
        deleteTooltip: "Eliminar sonido",
        saveTooltip: "Guardar nombre",
        cancelTooltip: "Cancelar",
        close: "Cerrar",
      },
      en: {
        addAudio: "Add audio (.mp3, .wav, .ogg)",
        settings: "Settings",
        dragAudios: "Drag audio files here",
        clickUpload: "or click to upload (.mp3, .wav, .ogg)",
        volume: "Volume",
        installedSounds: "Installed sounds",
        noSoundsYet: "No sounds added yet.",
        clearSoundboard: "Clear soundboard",
        done: "Done",
        soundSingular: "sound",
        soundPlural: "sounds",
        playInVoice: "Play in voice channel",
        previewOnly: "Private preview (you only - not in a voice chat)",
        renameTooltip: "Double click or click pencil to rename",
        deleteTooltip: "Delete sound",
        saveTooltip: "Save name",
        cancelTooltip: "Cancel",
        close: "Close",
      },
      pt: {
        addAudio: "Adicionar áudio (.mp3, .wav, .ogg)",
        settings: "Configurações",
        dragAudios: "Arraste áudios aqui",
        clickUpload: "ou clique para carregar (.mp3, .wav, .ogg)",
        volume: "Volume",
        installedSounds: "Sons instalados",
        noSoundsYet: "Nenhum som adicionado ainda.",
        clearSoundboard: "Esvaziar soundboard",
        done: "Pronto",
        soundSingular: "som",
        soundPlural: "sons",
        playInVoice: "Tocar no canal de voz",
        previewOnly: "Prévia privada (apenas você - fora de um chat de voz)",
        renameTooltip: "Duplo clique ou lápis para renomear",
        deleteTooltip: "Excluir som",
        saveTooltip: "Salvar nome",
        cancelTooltip: "Cancelar",
        close: "Fechar",
      }
    };

    function getLang() {
      const loc = (window.OnicordWidgetAPI?.env?.locale || window.OnicordWidgetAPI?.getLocale?.() || navigator.language || "es").toLowerCase();
      if (loc.startsWith("pt")) return "pt";
      if (loc.startsWith("en")) return "en";
      return "es";
    }

    function t(key) {
      const lang = getLang();
      return (I18N[lang] && I18N[lang][key]) || I18N.es[key] || "";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function applyStaticI18n() {
      const btnAdd = document.getElementById("btnAdd");
      const btnSettings = document.getElementById("btnSettings");
      const txtEmptyTitle = document.getElementById("txtEmptyTitle");
      const txtEmptySub = document.getElementById("txtEmptySub");
      const txtSettingsTitle = document.getElementById("txtSettingsTitle");
      const txtVolLabel = document.getElementById("txtVolLabel");
      const txtInstalledLabel = document.getElementById("txtInstalledLabel");
      const txtClearAll = document.getElementById("txtClearAll");
      const btnDoneSettings = document.getElementById("btnDoneSettings");
      const btnCloseSettings = document.getElementById("btnCloseSettings");

      if (btnAdd) btnAdd.title = t("addAudio");
      if (btnSettings) btnSettings.title = t("settings");
      if (txtEmptyTitle) txtEmptyTitle.textContent = t("dragAudios");
      if (txtEmptySub) txtEmptySub.textContent = t("clickUpload");
      if (txtSettingsTitle) txtSettingsTitle.textContent = t("settings");
      if (txtVolLabel) txtVolLabel.textContent = t("volume");
      if (txtInstalledLabel) txtInstalledLabel.textContent = t("installedSounds");
      if (txtClearAll) txtClearAll.textContent = t("clearSoundboard");
      if (btnDoneSettings) btnDoneSettings.textContent = t("done");
      if (btnCloseSettings) btnCloseSettings.title = t("close");
    }

    // State
    let sounds = [];
    let volume = 0.8;
    let isMuted = false;
    let duckMultiplier = 1.0;
    let isInitialized = false;
    const activeAudios = new Map();

    // DOM Elements
    const canvasEl = document.getElementById("canvas");
    const topActionsEl = document.querySelector(".top-actions");
    const emptyDropzone = document.getElementById("emptyDropzone");
    const soundGrid = document.getElementById("soundGrid");
    const fileInput = document.getElementById("fileInput");
    const btnAdd = document.getElementById("btnAdd");
    const btnSettings = document.getElementById("btnSettings");
    const panelSettings = document.getElementById("panelSettings");
    const btnCloseSettings = document.getElementById("btnCloseSettings");
    const btnDoneSettings = document.getElementById("btnDoneSettings");
    const btnMute = document.getElementById("btnMute");
    const soundIcon = document.getElementById("soundIcon");
    const volSlider = document.getElementById("volSlider");
    const valVol = document.getElementById("valVol");
    const manageList = document.getElementById("manageList");
    const soundCountLabel = document.getElementById("soundCountLabel");
    const btnClearAll = document.getElementById("btnClearAll");

    // Voice status tracking
    let currentVoiceStatus = {
      inVoice: false,
      channelId: null,
    };

    // Auto-ducking & Voice State listeners
    window.addEventListener("message", (e) => {
      if (e.data?.type === "VOICE_DUCKING") {
        duckMultiplier = e.data.duckMultiplier ?? 1.0;
        updateActiveVolumes();
      } else if (e.data?.type === "ONICORD_VOICE_STATE") {
        currentVoiceStatus.inVoice = Boolean(e.data.inVoice);
        currentVoiceStatus.channelId = e.data.channelId || null;
        updateCardTooltips();
      }
    });

    try {
      window.parent.addEventListener("voice-ducking-change", (e) => {
        duckMultiplier = e.detail?.duckMultiplier ?? 1.0;
        updateActiveVolumes();
      });
    } catch (_) {}

    function getVoiceState() {
      const apiInVoice = window.OnicordWidgetAPI?.voice?.isInVoice?.();
      const apiChannelId = window.OnicordWidgetAPI?.voice?.getChannelId?.();
      return {
        inVoice: Boolean(currentVoiceStatus.inVoice || apiInVoice),
        channelId: currentVoiceStatus.channelId || apiChannelId || null,
      };
    }

    function updateCardTooltips() {
      const v = getVoiceState();
      document.querySelectorAll(".sound-card").forEach((card) => {
        const nameSpan = card.querySelector(".card-name");
        const name = nameSpan?.textContent || "Audio";
        if (v.inVoice && v.channelId) {
          card.title = `${t("playInVoice")}: ${name}`;
        } else {
          card.title = `${t("previewOnly")}: ${name}`;
        }
      });
    }

    function updateActiveVolumes() {
      const eff = isMuted ? 0 : volume * duckMultiplier;
      activeAudios.forEach((audio) => {
        audio.volume = eff;
      });
    }

    // Volume Handling
    volSlider.addEventListener("input", (e) => {
      volume = parseFloat(e.target.value);
      isMuted = false;
      valVol.textContent = `${Math.round(volume * 100)}%`;
      soundIcon.textContent = volume === 0 ? "volume_off" : "volume_up";
      updateActiveVolumes();
      saveSettings();
    });

    btnMute.addEventListener("click", () => {
      isMuted = !isMuted;
      soundIcon.textContent = isMuted ? "volume_off" : (volume === 0 ? "volume_off" : "volume_up");
      valVol.style.opacity = isMuted ? "0.4" : "1";
      updateActiveVolumes();
      saveSettings();
    });

    function showView(view) {
      if (view === "settings") {
        canvasEl.style.display = "none";
        topActionsEl.style.display = "none";
        panelSettings.classList.add("show");
        renderManageList();
      } else {
        panelSettings.classList.remove("show");
        canvasEl.style.display = "flex";
        topActionsEl.style.display = "flex";
        updateCardMarquees();
      }
    }

    btnSettings.addEventListener("click", () => showView("settings"));
    btnCloseSettings.addEventListener("click", () => showView("main"));
    btnDoneSettings.addEventListener("click", () => showView("main"));

    // Clear All Sounds locally
    btnClearAll.addEventListener("click", () => {
      if (sounds.length === 0) return;
      sounds.forEach((snd) => {
        if (snd._blobUrl) {
          try { URL.revokeObjectURL(snd._blobUrl); } catch (_) {}
        }
      });
      sounds = [];
      saveCatalog();
      render();
      renderManageList();
    });

    async function loadSettings() {
      if (window.OnicordWidgetAPI?.storage?.get) {
        try {
          const raw = await window.OnicordWidgetAPI.storage.get("soundboard_settings");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.volume === "number") {
              volume = parsed.volume;
              volSlider.value = volume;
              valVol.textContent = `${Math.round(volume * 100)}%`;
            }
            if (typeof parsed.isMuted === "boolean") {
              isMuted = parsed.isMuted;
              soundIcon.textContent = isMuted ? "volume_off" : "volume_up";
              valVol.style.opacity = isMuted ? "0.4" : "1";
            }
          }
        } catch (_) {}
      }
    }

    async function saveSettings() {
      if (window.OnicordWidgetAPI?.storage?.set) {
        try {
          await window.OnicordWidgetAPI.storage.set("soundboard_settings", JSON.stringify({
            volume,
            isMuted
          }));
        } catch (_) {}
      }
    }

    // Save and load persistence via OnicordWidgetAPI.storage
    async function loadCatalog() {
      if (window.OnicordWidgetAPI?.storage?.get) {
        try {
          const raw = await window.OnicordWidgetAPI.storage.get("soundboard_catalog");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              sounds = parsed;
              render();
            }
          }
        } catch (_) {}
      }
    }

    async function saveCatalog() {
      if (window.OnicordWidgetAPI?.storage?.set) {
        try {
          const cleanToSave = sounds.map((s) => ({
            id: s.id,
            name: s.name,
            dataUrl: s.dataUrl,
            duration: s.duration,
          }));
          await window.OnicordWidgetAPI.storage.set("soundboard_catalog", JSON.stringify(cleanToSave));
        } catch (_) {}
      }
    }

    // Render Management List inside Settings
    function renderManageList() {
      const countLabel = `${sounds.length} ${sounds.length === 1 ? t("soundSingular") : t("soundPlural")}`;
      soundCountLabel.textContent = countLabel;
      btnClearAll.style.display = sounds.length > 0 ? "inline-flex" : "none";

      if (sounds.length === 0) {
        manageList.innerHTML = `<div class="empty-manage">${escapeHtml(t("noSoundsYet"))}</div>`;
        return;
      }

      manageList.innerHTML = "";
      sounds.forEach((snd) => {
        const item = document.createElement("div");
        item.className = "manage-item";
        item.id = `manage-item-${snd.id}`;

        function showDefaultView() {
          item.innerHTML = `
            <div class="manage-info" style="flex: 1; min-width: 0;">
              <span class="material-symbols-outlined" style="font-size: 15px; color: var(--subtext); flex-shrink: 0;">graphic_eq</span>
              <span class="manage-name" title="${escapeHtml(t("renameTooltip"))}">${escapeHtml(snd.name)}</span>
              <button class="btn-edit-item" title="${escapeHtml(t("renameTooltip"))}">
                <span class="material-symbols-outlined" style="font-size: 13px;">edit</span>
              </button>
            </div>
            <div class="manage-info" style="flex-shrink: 0;">
              <span class="manage-dur">${escapeHtml(snd.duration || "0:01")}</span>
              <button class="btn-del-item" title="${escapeHtml(t("deleteTooltip"))}" data-id="${escapeHtml(snd.id)}">
                <span class="material-symbols-outlined" style="font-size: 15px;">delete</span>
              </button>
            </div>
          `;

          const btnEdit = item.querySelector(".btn-edit-item");
          const nameSpan = item.querySelector(".manage-name");

          btnEdit.addEventListener("click", showEditView);
          nameSpan.addEventListener("dblclick", showEditView);

          const btnDel = item.querySelector(".btn-del-item");
          btnDel.addEventListener("click", () => {
            deleteSound(snd.id);
            renderManageList();
          });
        }

        function showEditView() {
          item.innerHTML = `
            <div class="manage-edit-row">
              <input type="text" class="manage-input" value="${escapeHtml(snd.name)}" maxlength="60" />
              <button class="btn-save-rename" title="${escapeHtml(t("saveTooltip"))}">
                <span class="material-symbols-outlined" style="font-size: 15px;">check</span>
              </button>
              <button class="btn-cancel-rename" title="${escapeHtml(t("cancelTooltip"))}">
                <span class="material-symbols-outlined" style="font-size: 15px;">close</span>
              </button>
            </div>
          `;

          const input = item.querySelector(".manage-input");
          const btnSave = item.querySelector(".btn-save-rename");
          const btnCancel = item.querySelector(".btn-cancel-rename");

          input.focus();
          input.select();

          function save() {
            const val = input.value.trim();
            if (val && val !== snd.name) {
              renameSound(snd.id, val);
            } else {
              showDefaultView();
            }
          }

          function cancel() {
            showDefaultView();
          }

          btnSave.addEventListener("click", save);
          btnCancel.addEventListener("click", cancel);

          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              save();
            } else if (e.key === "Escape") {
              e.preventDefault();
              cancel();
            }
          });
        }

        showDefaultView();
        manageList.appendChild(item);
      });
    }

    // Render Main Sound Cards Grid
    function render() {
      if (sounds.length === 0) {
        emptyDropzone.style.display = "flex";
        soundGrid.style.display = "none";
        if (window.OnicordWidgetAPI?.island?.setSummary) {
          window.OnicordWidgetAPI.island.setSummary(`0 ${t("soundPlural")}`);
        }
        return;
      }

      emptyDropzone.style.display = "none";
      soundGrid.style.display = "grid";
      soundGrid.innerHTML = "";

      sounds.forEach((snd) => {
        const card = document.createElement("div");
        card.className = "sound-card";
        card.id = `snd-${snd.id}`;
        
        const v = getVoiceState();
        card.title = v.inVoice && v.channelId
          ? `${t("playInVoice")}: ${snd.name}`
          : `${t("previewOnly")}: ${snd.name}`;

        card.innerHTML = `
          <span class="material-symbols-outlined card-icon">graphic_eq</span>
          <div class="card-name-wrapper">
            <span class="card-name">${escapeHtml(snd.name)}</span>
          </div>
          <span class="card-duration">${escapeHtml(snd.duration || "0:01")}</span>
        `;

        card.addEventListener("click", () => {
          playSound(snd, true);
        });

        soundGrid.appendChild(card);
      });

      if (window.OnicordWidgetAPI?.island?.setSummary) {
        window.OnicordWidgetAPI.island.setSummary(`${sounds.length} ${sounds.length === 1 ? t("soundSingular") : t("soundPlural")}`);
      }

      updateCardMarquees();
      updateCardTooltips();
    }

    function updateCardMarquees() {
      requestAnimationFrame(() => {
        document.querySelectorAll(".sound-card").forEach((card) => {
          const wrapper = card.querySelector(".card-name-wrapper");
          const nameSpan = card.querySelector(".card-name");
          if (!wrapper || !nameSpan) return;

          const wrapperWidth = wrapper.clientWidth || 86;
          const textWidth = nameSpan.scrollWidth;

          if (textWidth > wrapperWidth + 2) {
            card.classList.add("has-overflow");
            const overflowDist = textWidth - wrapperWidth;
            nameSpan.style.setProperty("--marquee-dist", `-${overflowDist + 6}px`);
            const dur = Math.max(2.6, Math.min(8, (overflowDist / 20) + 1.5)).toFixed(1);
            nameSpan.style.setProperty("--marquee-dur", `${dur}s`);
          } else {
            card.classList.remove("has-overflow");
            nameSpan.style.removeProperty("--marquee-dist");
            nameSpan.style.removeProperty("--marquee-dur");
          }
        });
      });
    }

    window.addEventListener("resize", updateCardMarquees);

    function getPlayableUrl(snd) {
      if (snd._blobUrl) return snd._blobUrl;
      if (snd.dataUrl && snd.dataUrl.startsWith("data:")) {
        try {
          const parts = snd.dataUrl.split(",");
          const mime = parts[0].match(/:(.*?);/)?.[1] || "audio/ogg";
          const bstr = atob(parts[1]);
          let n = bstr.length;
          const u8arr = new Uint8Array(n);
          while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
          }
          const blob = new Blob([u8arr], { type: mime });
          snd._blobUrl = URL.createObjectURL(blob);
          return snd._blobUrl;
        } catch (_) {
          return snd.dataUrl;
        }
      }
      return snd.dataUrl;
    }

    function playSound(snd, isLocalTrigger = false) {
      if (!snd || !snd.dataUrl) return;

      const eff = isMuted ? 0 : volume * duckMultiplier;
      const playUrl = getPlayableUrl(snd);
      const audio = new Audio(playUrl);
      audio.volume = eff;

      const card = document.getElementById(`snd-${snd.id}`);
      if (card) card.classList.add("playing");

      activeAudios.set(audio, audio);

      audio.onended = () => {
        if (card) card.classList.remove("playing");
        activeAudios.delete(audio);
      };
      audio.onerror = () => {
        if (card) card.classList.remove("playing");
        activeAudios.delete(audio);
      };

      audio.play().catch(() => {});

      if (isLocalTrigger) {
        const v = getVoiceState();
        if (v.inVoice && v.channelId && window.OnicordWidgetAPI?.p2p?.broadcast) {
          window.OnicordWidgetAPI.p2p.broadcast({
            type: "PLAY_SOUND",
            soundId: snd.id,
            sound: {
              id: snd.id,
              name: snd.name,
              dataUrl: snd.dataUrl,
              duration: snd.duration
            },
            voiceChannelId: v.channelId,
          });
        }
      }
    }

    function handleFile(file) {
      if (!file) return;
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      const isAudio =
        (file.type && (file.type.startsWith("audio/") || file.type.includes("ogg"))) ||
        ["mp3", "wav", "ogg", "opus", "m4a", "aac", "flac", "webm"].includes(ext);

      if (!isAudio) return;

      const directBlobUrl = URL.createObjectURL(file);
      const reader = new FileReader();

      reader.onload = (e) => {
        const dataUrl = e.target.result;
        const cleanName = file.name.replace(/\.[^/.]+$/, "").slice(0, 60);

        let committed = false;
        const finalizeSound = (durationSec = 1) => {
          if (committed) return;
          committed = true;
          const sec = Math.max(1, Math.round(durationSec));
          const durStr = `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, "0")}`;

          const newSound = {
            id: `snd_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`,
            name: cleanName,
            dataUrl,
            duration: durStr,
            _blobUrl: directBlobUrl,
          };

          sounds.push(newSound);
          saveCatalog();
          render();

          if (window.OnicordWidgetAPI?.p2p?.broadcast) {
            window.OnicordWidgetAPI.p2p.broadcast({
              type: "ADD_SOUND",
              sound: {
                id: newSound.id,
                name: newSound.name,
                dataUrl: newSound.dataUrl,
                duration: newSound.duration,
              },
            });
          }
        };

        try {
          const tmpAudio = new Audio(directBlobUrl);
          tmpAudio.onloadedmetadata = () => {
            finalizeSound(tmpAudio.duration || 1);
          };
          tmpAudio.onerror = () => {
            finalizeSound(1);
          };
          setTimeout(() => finalizeSound(1), 1200);
        } catch (_) {
          finalizeSound(1);
        }
      };

      reader.readAsDataURL(file);
    }

    function renameSound(soundId, newName) {
      const trimmed = (newName || "").trim();
      if (!trimmed) return;

      const snd = sounds.find((s) => s.id === soundId);
      if (!snd || snd.name === trimmed) return;

      snd.name = trimmed;
      saveCatalog();
      render();
      renderManageList();

      if (window.OnicordWidgetAPI?.p2p?.broadcast) {
        window.OnicordWidgetAPI.p2p.broadcast({
          type: "RENAME_SOUND",
          soundId,
          newName: trimmed,
        });
      }
    }

    function deleteSound(soundId) {
      const snd = sounds.find((s) => s.id === soundId);
      if (snd && snd._blobUrl) {
        try { URL.revokeObjectURL(snd._blobUrl); } catch (_) {}
      }
      sounds = sounds.filter((s) => s.id !== soundId);
      saveCatalog();
      render();

      if (window.OnicordWidgetAPI?.p2p?.broadcast) {
        window.OnicordWidgetAPI.p2p.broadcast({
          type: "REMOVE_SOUND",
          soundId,
        });
      }
    }

    // Drag and Drop
    ["dragenter", "dragover"].forEach((evt) => {
      window.addEventListener(evt, (e) => {
        e.preventDefault();
        document.body.classList.add("dragover");
        emptyDropzone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach((evt) => {
      window.addEventListener(evt, (e) => {
        e.preventDefault();
        document.body.classList.remove("dragover");
        emptyDropzone.classList.remove("dragover");
      });
    });

    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const files = e.dataTransfer?.files;
      if (files && files.length > 0) {
        Array.from(files).forEach(handleFile);
      }
    });

    emptyDropzone.addEventListener("click", () => fileInput.click());
    btnAdd.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      if (e.target.files) {
        Array.from(e.target.files).forEach(handleFile);
        fileInput.value = "";
      }
    });

    // P2P Messaging setup
    function setupP2P() {
      if (!window.OnicordWidgetAPI?.p2p) return;

      window.OnicordWidgetAPI.p2p.onMessage((msg) => {
        if (!msg || !msg.type) return;

        if (msg.type === "PLAY_SOUND") {
          const v = getVoiceState();

          if (msg.voiceChannelId) {
            if (!v.inVoice || v.channelId !== msg.voiceChannelId) {
              return;
            }
          } else {
            if (!v.inVoice) return;
          }

          const snd = sounds.find((s) => s.id === msg.soundId) || msg.sound;
          if (snd) playSound(snd, false);
        } else if (msg.type === "ADD_SOUND" && msg.sound) {
          if (!sounds.some((s) => s.id === msg.sound.id)) {
            sounds.push(msg.sound);
            saveCatalog();
            render();
            if (panelSettings.classList.contains("show")) {
              renderManageList();
            }
          }
        } else if (msg.type === "REMOVE_SOUND" && msg.soundId) {
          const snd = sounds.find((s) => s.id === msg.soundId);
          if (snd && snd._blobUrl) {
            try { URL.revokeObjectURL(snd._blobUrl); } catch (_) {}
          }
          sounds = sounds.filter((s) => s.id !== msg.soundId);
          saveCatalog();
          render();
          if (panelSettings.classList.contains("show")) {
            renderManageList();
          }
        } else if (msg.type === "RENAME_SOUND" && msg.soundId && msg.newName) {
          const snd = sounds.find((s) => s.id === msg.soundId);
          if (snd && snd.name !== msg.newName) {
            snd.name = msg.newName;
            saveCatalog();
            render();
            if (panelSettings.classList.contains("show")) {
              renderManageList();
            }
          }
        } else if (msg.type === "REQUEST_CATALOG") {
          if (sounds.length > 0) {
            window.OnicordWidgetAPI.p2p.broadcast({
              type: "CATALOG_RESPONSE",
              sounds: sounds.map((s) => ({
                id: s.id,
                name: s.name,
                dataUrl: s.dataUrl,
                duration: s.duration
              })),
            });
          }
        } else if (msg.type === "CATALOG_RESPONSE" && Array.isArray(msg.sounds)) {
          let updated = false;
          msg.sounds.forEach((remoteSnd) => {
            const existing = sounds.find((s) => s.id === remoteSnd.id);
            if (!existing) {
              sounds.push(remoteSnd);
              updated = true;
            } else if (existing.name !== remoteSnd.name) {
              existing.name = remoteSnd.name;
              updated = true;
            }
          });
          if (updated) {
            saveCatalog();
            render();
            if (panelSettings.classList.contains("show")) {
              renderManageList();
            }
          }
        }
      });

      window.OnicordWidgetAPI.p2p.broadcast({ type: "REQUEST_CATALOG" });
    }

    async function init() {
      if (isInitialized) return;
      isInitialized = true;
      applyStaticI18n();
      await loadSettings();
      await loadCatalog();
      setupP2P();
    }

    // Init lifecycle
    window.addEventListener("onicord:widget-ready", init);
    if (window.OnicordWidgetAPI) {
      init();
    } else {
      setTimeout(init, 250);
    }
  </script>
</body>
</html>
