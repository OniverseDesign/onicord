<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      background: transparent;
      color: #cdd6f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 100vh;
    }
    .timer-card {
      text-align: center;
      width: 100%;
    }
    .timer-display {
      font-size: 32px;
      font-weight: 800;
      font-family: monospace;
      color: #89b4fa;
      margin: 10px 0;
      letter-spacing: 1px;
    }
    .user-info {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 6px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="timer-card">
    <div class="user-info" id="userInfo">Focus Time</div>
    <div class="timer-display" id="display">25:00</div>
    <button class="btn" id="toggleBtn">Iniciar</button>
  </div>

  <script>
    let time = 1500;
    let timerId = null;

    window.addEventListener("onicord:widget-ready", async () => {
      // Demostración del permiso: user.profile
      const user = OnicordWidgetAPI.user.getProfile();
      if (user && user.nickname) {
        document.getElementById("userInfo").textContent = `Focus for ${user.nickname}`;
      }

      // Demostración del permiso: storage
      const savedTime = await OnicordWidgetAPI.storage.get("pomodoro_time");
      if (savedTime) {
        time = parseInt(savedTime, 10);
        updateDisplay();
      }
    });

    function updateDisplay() {
      const m = String(Math.floor(time / 60)).padStart(2, "0");
      const s = String(time % 60).padStart(2, "0");
      document.getElementById("display").textContent = `${m}:${s}`;
    }

    document.getElementById("toggleBtn").onclick = () => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        document.getElementById("toggleBtn").textContent = "Reanudar";
      } else {
        document.getElementById("toggleBtn").textContent = "Pausar";
        timerId = setInterval(() => {
          if (time > 0) {
            time--;
            updateDisplay();
            OnicordWidgetAPI.storage.set("pomodoro_time", time);
          } else {
            clearInterval(timerId);
            timerId = null;
            document.getElementById("toggleBtn").textContent = "Reiniciar";
          }
        }, 1000);
      }
    };
  </script>
</body>
</html>
